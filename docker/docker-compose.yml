
services:
  postgres:
    image: postgres:16-alpine
    container_name: usuarios_roles_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_2026
      POSTGRES_DB: usuarios_roles_db
    ports:
      - "5434:5432"
    volumes:
      - usuarios_roles_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_roles_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  usuarios_roles_data:
